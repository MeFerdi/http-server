server {
    host        0.0.0.0
    port        8080
    server_name localhost
    body_limit  10485760    # 10 MB

    error_page  400  ./www/errors/400.html
    error_page  403  ./www/errors/403.html
    error_page  404  ./www/errors/404.html
    error_page  405  ./www/errors/405.html
    error_page  413  ./www/errors/413.html
    error_page  500  ./www/errors/500.html

    # Default route — serves static files
    location / {
        methods           GET POST DELETE
        root              ./www
        default_file      index.html
        directory_listing off
    }

    # Directory browsing for /files
    location /files {
        methods           GET
        root              ./www/files
        directory_listing on
    }

    # CGI scripts
    location /cgi-bin {
        methods  GET POST
        root     ./cgi-bin
        cgi      .py /usr/bin/python3
    }

    # File uploads
    location /uploads {
        methods  POST DELETE
        root     ./uploads
    }

    # Legacy redirect
    location /old-blog {
        redirect /blog
    }
}

# Second virtual server on a different port
server {
    host        0.0.0.0
    port        9091
    server_name api.localhost
    body_limit  1048576    # 1 MB

    location / {
        methods  GET POST DELETE
        root     ./www/api
    }
}
